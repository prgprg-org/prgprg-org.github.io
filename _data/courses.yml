- title: Program Analysis
  schedule: Thursday 12:45, T9:346
  lecturer: Filip Krikava, FIT
  link: https://bk.fit.cvut.cz/en/predmety/00/00/00/00/00/00/06/08/21/p6082106.html
  label: Learn the art of reasoning about programs without running them. We cover the basic techniques of static and dynamic program analysis.

- title: Object-Oriented Programming
  schedule: Friday 12:45, T9:155
  lecturer: Filip Krikava, FIT
  link: https://bilakniha.cvut.cz/en/predmet6624306.html
  label: Learn OOP techniques including polymorphism (subtyping, parametric and ahdoc), composition, encapsulation and how it helps to organize your code.

- title: Runtime Systems
  schedule: Summer 2025/26
  lecturer: Filip Krikava, FIT
  link: https://bk.fit.cvut.cz/en/predmety/00/00/00/00/00/00/06/11/45/p6114506.html
  label: Learn how to build a virtual machine for a JS-like programming language including AST and BC interpretation, garbage-collection and just-in-time compilation.

- title: Virtual Machines and Managed Runtimes
  schedule: Summer 2026/27
  lecturer: Štěpán Šindelář, MFF
  link: https://d3s.mff.cuni.cz/teaching/nprg076/
  label: Learn about real-world virtual machines internals, with a focus on JVM, GraalVM, and Python. Get hands-on experience with the Truffle language implementation framework.

- title: Advanced Program Testing
  schedule: Friday, 14:30 (odd weeks)/16:15 (even weeks), T9:346
  lecturer: Pierre Donat-Bouillud, FIT
  link: https://bilakniha.cvut.cz/en/predmet7585206.html
  label: Learn how to test a program, from specification, structural, property-based, and mutation testing, to fuzzing and symbolic execution.
  language: English

- title: Programming Paradigms
  schedule: Friday 9:15, JP:B-671 (EN) and Friday 11:00, T9:155 (CZ)
  lecturer: Tomáš Jakl, Petr Maj and Jan Liam Verter, FIT
  link: https://bilakniha.cvut.cz/cs/predmet6706506.html
  label: An introductory course to the theory of programming languages and to functional and logic programming. See [Czech](https://bilakniha.cvut.cz/cs/predmet6704206.html#gsc.tab=0) or [English](https://bilakniha.cvut.cz/cs/predmet6706506.html#gsc.tab=0) parallel information page.
  language: English/Czech

- title: Principles of Programming Languages
  schedule: Summer 2026/27
  lecturer: Vít Šefl & Tomas Petricek, MFF
  link: https://is.cuni.cz/studium/predmety/index.php?do=predmet&kod=NPRG084
  label: Learn about basic principles and concepts of programming languages, including structured, object-oriented and functional programming.
  language: Czech/English

- title: Code Generation
  schedule: Winter 2025/26
  lecturer: Petr Maj, FIT
  link: https://bilakniha.cvut.cz/cs/predmet6114906.html
  label: Learn how to build a compiler for a C-like programming language with emphasis on program optimization and target code generation.
  language: English/Czech

- title: Semantics of Programming Languages
  schedule: Winter 2026/27
  lecturer: Tomáš Jakl
  link: https://tomas.jakl.one/teaching
  label: An introduction to the study of PL semantics. We will look at denotational, operational and axiomatic semantics and the comparison of these. The problem of full abstraction will be also discussed.
  language: English/Czech

- title: Programming in Haskell
  schedule: Summer 2026/27
  lecturer: Miroslav Kratochvíl, MFF
  link: https://teaching.mff.cuni.cz/nprg068-web/
  label: Very pratically-oriented course about making realistic software in a high-level strictly-typed lazy programming language. Focuses on use of the most distinguishing features and ecosystem libraries.
  language: Czech (switches to English on demand)

- title: Effective Software
  schedule: Summer 2025/26, Mondays 12:45, KN:E-301
  lecturer: Jakub Dupák & David Šišlák, FEL
  link: https://esw.pages.fel.cvut.cz/
  label: Learn how to write effective software, from hardware, through operating systems, to compilers and programming languages.
  language: English (+ Czech labs available)

- title: Theory of Programming Languages
  schedule: Winter 2026/27, Wed 12:20 in S10
  lecturer: Vít Šefl & Tomas Petricek, MFF
  link: https://is.cuni.cz/studium/predmety/index.php?do=predmet&kod=NPRG085
  label: Learn about theoretical concepts and tools for studying programming languages. We will look at formal models of programming languages and explore their properties.
  language: Czech/English
  current: yes

- title: Cultures of Programming
  schedule: Winter 2026/27, Tue 10:40 in S10
  lecturer: Tomas Petricek, MFF
  link: https://d3s.mff.cuni.cz/teaching/nprg088/
  label: How programming emerged and developed from the 1940s to the present amid collaborations and clashes between engineers, mathematicians, hackers, managers and humanists.
  language: English
  current: yes
